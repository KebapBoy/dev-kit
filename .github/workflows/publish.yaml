# Publishes the feature to ghcr.io/<owner>/dev-kit/dev-kit when a release tag v<x.y.z> is pushed:
# first the checks of check.yaml on the tag, then, once a reviewer of the environment "release"
# approves it, the feature (every devcontainer runs it, so a pushed tag alone must not publish it),
# and last a GitHub release with the changelog section of the version.
# The version comes from the tag, which must match VERSION; it is written into
# devcontainer-feature.json only here, so the file in git keeps 0.0.0.
name: publish

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: read

jobs:
    check:
        uses: ./.github/workflows/check.yaml

    publish:
        needs: check
        runs-on: ubuntu-24.04
        environment: release
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set the version from the tag
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $GITHUB_REF_NAME"; exit 1; }
                  [[ "$(cat VERSION)" == "$version" ]] || { echo "tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
                  jq --arg v "$version" '.version = $v' src/dev-kit/devcontainer-feature.json > feature.json
                  mv feature.json src/dev-kit/devcontainer-feature.json
            - name: Publish the feature
              uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
              with:
                  publish-features: "true"
                  base-path-to-features: ./src
                  disable-repo-tagging: "true"
                  devcontainer-cli-version: 0.80.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release:
        needs: publish
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Create the GitHub release from the changelog
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  # The section "## [x.y.z] - date" up to the next "## [" (or the link list at the end)
                  awk -v v="$version" '
                      index($0, "## [" v "]") == 1 { found = 1; next }
                      found && (/^## \[/ || /^\[[^]]*\]: /) { exit }
                      found { print }
                  ' CHANGELOG.md > notes.md
                  grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
                  gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --notes-file notes.md
