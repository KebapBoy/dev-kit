# Checks on every pull request and on every release tag (publish.yaml calls this workflow before it
# publishes anything): formatting and shellcheck (just check), and the feature tests in every
# scenario of test/dev-kit/scenarios.json (with Sysbox for the option docker). Not on every push to
# main: dev-kit release runs just check before it tags, and a release is what gets published.
# Start it by hand in the Actions tab (workflow_dispatch) to test main before a release.
name: check

on:
    pull_request:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install just
              run: .github/install-just.sh
            - run: just check

    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install Sysbox
              run: .github/install-sysbox.sh
            - name: Feature tests
              run: npx -y @devcontainers/cli@0.80.1 features test -f dev-kit --skip-autogenerated -p .
