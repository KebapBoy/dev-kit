# Checks on every push and pull request: formatting and shellcheck (just check), and the feature
# tests in every scenario of test/dev-kit/scenarios.json (with Sysbox for the option docker).
# publish.yaml runs them too, on the release tag, before it publishes anything.
name: check

on:
    push:
        branches: [main]
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install just
              run: .github/install-just.sh
            - run: just check

    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Install Sysbox
              run: .github/install-sysbox.sh
            - name: Feature tests
              run: npx -y @devcontainers/cli@0.80.1 features test -f dev-kit --skip-autogenerated -p .
